<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>La Kailasha Regency — Room Service</title>
<style>
:root{--gold:#b8860b;--dark:#172018;--cream:#fffaf0;--green:#198754}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f6f3ed;color:#202020}
header{background:linear-gradient(135deg,#18251b,#314c35);color:white;padding:24px 16px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px #0003}
h1{margin:0;font-size:25px}.sub{opacity:.85;margin-top:5px}
.wrap{max-width:900px;margin:auto;padding:16px 16px 110px}
.panel{background:white;border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 12px #00000012}
label{font-weight:700;font-size:14px}.row{display:flex;gap:10px;flex-wrap:wrap}
input,textarea{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:7px}
.field{flex:1;min-width:220px}.search{margin-bottom:12px}
.cat{margin-top:22px}.cat h2{font-size:19px;margin:0 0 10px;border-left:4px solid var(--gold);padding-left:9px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
.item:last-child{border-bottom:0}.iname{font-weight:600}.price{font-weight:700;margin-left:auto;white-space:nowrap}
button{border:0;border-radius:10px;padding:9px 13px;cursor:pointer;font-weight:700}
.add{background:#18251b;color:white}.qty{display:flex;align-items:center;gap:7px}.qty button{background:#eee;width:34px;height:34px;padding:0;font-size:18px}
#cart{display:none}.cartline{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
.total{font-size:20px;font-weight:800;text-align:right;margin-top:12px}
.order{position:fixed;bottom:0;left:0;right:0;background:white;padding:10px 16px;box-shadow:0 -2px 12px #0002;z-index:10}
.order button{display:block;max-width:900px;margin:auto;width:100%;background:#25D366;color:#073b1a;font-size:18px;padding:15px}
.note{font-size:12px;color:#666;margin-top:8px;text-align:center}
.empty{color:#777;text-align:center;padding:10px}
</style>

<body>
<header>
  <div class="wrap" style="padding:0 16px">
    <h1>La Kailasha Regency — Room Service</h1>
    <div class="sub">Manali • Order food directly from your room</div>
  </div>
</header>

<main class="wrap">

    <div class="row">
      <div class="field">
<label>Location *</label>
<select id="room" style="width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin-top:7px">
<option value="">Select Cottage / Room</option>
<optgroup label="Cottage">
<option value="Cottage">Cottage</option>
<option value="Cottage - 1st Floor">Cottage - 1st Floor</option>
<option value="Cottage - 2nd Floor">Cottage - 2nd Floor</option>
</optgroup>
<optgroup label="Room">
<option value="Room - 101">Room - 101</option>
<option value="Room - 102">Room - 102</option>
<option value="Room - 103">Room - 103</option>
<option value="Room - 104">Room - 104</option>
<option value="Room - 105">Room - 105</option>
<option value="Room - 106">Room - 106</option>
<option value="Room - 107">Room - 107</option>
<option value="Room - 108">Room - 108</option>
<option value="Room - 109">Room - 109</option>
<option value="Room - 110">Room - 110</option>
</optgroup>
</select>
</div>
      <div class="field"><label>Guest Name</label><input id="guest" placeholder="Optional"></div>
      <div class="field"><label>Order Date</label><input id="orderDate" type="text" readonly></div>
      <div class="field"><label>Order Time</label><input id="orderTime" type="text" readonly></div>
    </div>
    <div style="margin-top:12px"><label>Special Instructions</label><textarea id="note" rows="2" placeholder="Less spicy, no onion, etc."></textarea></div>
  </div>

  <div class="panel">
    <input class="search" id="search" placeholder="🔎 Search menu...">
    <div id="menu"></div>
  </div>

  <div class="panel" id="cart">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2 style="margin:0">🛒 Your Order</h2><button onclick="clearOrder()" style="background:#eee">CLEAR ORDER</button></div>
    <div id="cartItems"></div>
    <div class="total">Total: ₹<span id="total">0</span></div>
  </div>
</main>

<div class="order">
  <button onclick="sendOrder()">📲 PLACE ORDER ON WHATSAPP</button>
  <div class="note">Your order will be sent to hotel reception / kitchen on WhatsApp.</div>
</div>

tegory": "Pizza & Pasta", "name": "Margherita Pizza 8\"", "price": 300}, {"category": "Pizza & Pasta", "name": "Veg Farmhouse Pizza 8\"", "price": 380}, {"category": "Pizza & Pasta", "name": "Pepperoni Pizza 8\"", "price": 400}, {"category": "Pizza & Pasta", "name": "Chicken Loaded Pizza 8\"", "price": 400}, {"category": "Pizza & Pasta", "name": "Red / White Pasta", "price": 300}, {"category": "Pizza & Pasta", "name": "Mozzarella Add-on", "price": 120}, {"category": "Pizza & Pasta", "name": "Sweet Corn / Paneer / Jalapeno Add-on", "price": 60}, {"category": "Pizza & Pasta", "name": "Olive Add-on", "price": 80}, {"category": "Chinese", "name": "Veg Noodles", "price": 220}, {"category": "Chinese", "name": "Chicken Noodles", "price": 300}, {"category": "Chinese", "name": "Egg Noodles", "price": 280}, {"category": "Chinese", "name": "Spring Rolls", "price": 260}, {"category": "Chinese", "name": "Veg Fried Rice", "price": 240}, {"category": "Chinese", "name": "Paneer Fried Rice", "price": 280}, {"category": "Chinese", "name": "Chicken Fried Rice", "price": 300}, {"category": "Chinese", "name": "Egg Fried Rice", "price": 280}, {"category": "Chinese", "name": "Veg Manchurian", "price": 270}, {"category": "Chinese", "name": "Chilly Paneer", "price": 280}, {"category": "Chinese", "name": "Chilly Chicken", "price": 350}, {"category": "Chinese", "name": "Chilly Mushroom", "price": 250}, {"category": "Chinese", "name": "Honey Chilly Potato", "price": 250}, {"category": "Dal", "name": "Dal Tadka", "price": 250}, {"category": "Dal", "name": "Rajma Masala", "price": 280}, {"category": "Dal", "name": "Dal Makhani", "price": 280}, {"category": "Dal", "name": "Chana Masala", "price": 260}, {"category": "Dal", "name": "Mix Dal", "price": 280}, {"category": "Dal", "name": "Dal Fry", "price": 220}, {"category": "Veg / Paneer", "name": "Mix Veg", "price": 250}, {"category": "Veg / Paneer", "name": "Aloo Gobhi", "price": 220}, {"category": "Veg / Paneer", "name": "Aloo Matar", "price": 220}, {"category": "Veg / Paneer", "name": "Aloo Jeera", "price": 220}, {"category": "Veg / Paneer", "name": "Bhindi Do Pyaza", "price": 280}, {"category": "Veg / Paneer", "name": "Matar Paneer", "price": 280}, {"category": "Veg / Paneer", "name": "Shahi Paneer", "price": 300}, {"category": "Veg / Paneer", "name": "Kadhai Paneer", "price": 280}, {"category": "Veg / Paneer", "name": "Paneer Do Pyaza", "price": 280}, {"category": "Veg / Paneer", "name": "Paneer Bhurji", "price": 300}, {"category": "Veg / Paneer", "name": "Palak Paneer", "price": 280}, {"category": "Veg / Paneer", "name": "Paneer Lababdar", "price": 290}, {"category": "Veg / Paneer", "name": "Paneer Kofta", "price": 300}, {"category": "Veg / Paneer", "name": "Bhindi Masala", "price": 250}, {"category": "Veg / Paneer", "name": "Mushroom Do Pyaza", "price": 280}, {"category": "Veg / Paneer", "name": "Malai Kofta", "price": 300}, {"category": "Veg / Paneer", "name": "Matar Mushroom", "price": 280}, {"category": "Non-Veg Curry", "name": "Chicken Curry", "price": 450}, {"category": "Non-Veg Curry", "name": "Butter Chicken", "price": 480}, {"category": "Non-Veg Curry", "name": "Kadhai Chicken", "price": 480}, {"category": "Non-Veg Curry", "name": "Chicken Lababdar", "price": 480}, {"category": "Non-Veg Curry", "name": "Chicken Do Pyaza", "price": 480}, {"category": "Non-Veg Curry", "name": "Tawa Chicken", "price": 480}, {"category": "Non-Veg Curry", "name": "Egg Curry", "price": 280}, {"category": "Non-Veg Curry", "name": "Boneless Add-on", "price": 80}, {"category": "Non-Veg Curry", "name": "Mutton (Pre Order)", "price": 600}, {"category": "Non-Veg Curry", "name": "Fish (Pre Order)", "price": 500}, {"category": "Roti", "name": "Tawa Roti", "price": 25}, {"category": "Roti", "name": "Butter Roti", "price": 30}, {"category": "Roti", "name": "Lacha Paratha", "price": 60}, {"category": "Roti", "name": "Garlic Lacha Paratha", "price": 100}, {"category": "Rice", "name": "Steam Rice", "price": 150}, {"category": "Rice", "name": "Jeera Rice", "price": 170}, {"category": "Rice", "name": "Veg Pulao", "price": 250}, {"category": "Rice", "name": "Veg Biryani", "price": 270}, {"category": "Rice", "name": "Chicken Biryani", "price": 350}, {"category": "Rice", "name": "Egg Rice", "price": 330}, {"category": "Extras", "name": "Gulab Jamun (2)", "price": 100}, {"category": "Extras", "name": "Water Bottle", "price": 30}, {"category": "Extras", "name": "Soda", "price": 40}, {"category": "Extras", "name": "Soft Drink", "price": 50}, {"category": "Extras", "name": "Ice Cube", "price": 40}, {"category": "Extras", "name": "Maggie", "price": 60}, {"category": "Extras", "name": "Egg Maggie", "price": 100}, {"category": "Extras", "name": "Veg Maggie", "price": 80}, {"category": "Services", "name": "Hookah", "price": 500}, {"category": "Services", "name": "Room Heater", "price": 500}, {"category": "Services", "name": "Barbeque - Per Person (Min 6)", "price": 700}];
const cart = {};
function setCurrentDateTime(){
  const now = new Date();
  const date = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Kolkata', day:'2-digit', month:'2-digit', year:'numeric'
  }).format(now);
  const time = new Intl.DateTimeFormat('en-GB', {
    timeZone:'Asia/Kolkata', hour:'2-digit', minute:'2-digit', second:'2-digit',
    hour12:false
  }).format(now);
  document.getElementById('orderDate').value = date;
  document.getElementById('orderTime').value = time;
}
setCurrentDateTime();
setInterval(setCurrentDateTime, 1000);

function money(n){return n.toLocaleString('en-IN')}
function makeOrderId(){
  const now=new Date();
  const pad=n=>String(n).padStart(2,'0');
  return `LK-${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}-${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`;
}
let orderId=makeOrderId();
function clearOrder(){
  for(const k of Object.keys(cart)) delete cart[k];
  renderCart(); render();
}
function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const root=document.getElementById('menu'); root.innerHTML='';
  const groups={};
  products.forEach((p,i)=>{if((p.name+' '+p.category).toLowerCase().includes(q)){(groups[p.category]??=[]).push({...p,i})}});
  for(const [cat,arr] of Object.entries(groups)){
    const sec=document.createElement('section'); sec.className='cat';
    sec.innerHTML='<h2>'+cat+'</h2>';
    arr.forEach(p=>{
      const qty=cart[p.i]||0;
      const el=document.createElement('div'); el.className='item';
      el.innerHTML=`<div><div class="iname">${p.name}</div><div class="price">₹${money(p.price)}</div></div>
        ${qty?`<div class="qty"><button onclick="change(${p.i},-1)">−</button><b>${qty}</b><button onclick="change(${p.i},1)">+</button></div>`
        :`<button class="add" onclick="change(${p.i},1)">ADD</button>`}`;
      sec.appendChild(el);
    }); root.appendChild(sec);
  }
}
function change(i,d){cart[i]=Math.max(0,(cart[i]||0)+d);if(!cart[i])delete cart[i];renderCart();render()}
function renderCart(){
  const box=document.getElementById('cart'), list=document.getElementById('cartItems');
  let total=0, count=0; list.innerHTML='';
  for(const [k,v] of Object.entries(cart)){
    const p=products[k]; total+=p.price*v; count+=v;
    const row=document.createElement('div');row.className='cartline';
    row.innerHTML=`<span>${p.name} × ${v}</span><b>₹${money(p.price*v)}</b>`;list.appendChild(row);
  }
  box.style.display=count?'block':'none';document.getElementById('total').textContent=money(total);
}
function sendOrder(){
  const room=document.getElementById('room').value.trim();
  const guest=document.getElementById('guest').value.trim();
  const note=document.getElementById('note').value.trim();
  if(!room){alert('Please select your Cottage / Room.');return}
  const entries=Object.entries(cart);
  if(!entries.length){alert('Please add at least one item.');return}

  let total=0;
  const lines=[];
  lines.push('NEW ROOM ORDER - LA KAILASHA REGENCY');
  lines.push('');
  lines.push('Order ID: ' + orderId);
  lines.push('Cottage / Room: ' + room);
  if(guest) lines.push('Guest: ' + guest);

  const orderDate = document.getElementById('orderDate').value;
  const orderTime = document.getElementById('orderTime').value;
  if(orderDate) lines.push('Date: ' + orderDate);
  if(orderTime) lines.push('Time: ' + orderTime);

  lines.push('');
  lines.push('ORDER:');
  entries.forEach(([k,v])=>{
    const p=products[k];
    total += p.price*v;
    lines.push('- ' + p.name + ' x ' + v + ' - Rs.' + (p.price*v));
  });

  lines.push('');
  lines.push('TOTAL: Rs.' + total);
  if(note) lines.push('Note: ' + note);
  lines.push('');
  lines.push('Please confirm and prepare this order.');

  // Encode the complete message once to prevent replacement '?' characters.
  // WhatsApp message is deliberately ASCII-only for maximum compatibility.
  const safeLines = lines.map(s => String(s)
    .replace(/₹/g, 'Rs.')
    .replace(/[•·]/g, '-')
    .replace(/[—–−]/g, '-')
    .replace(/[“”‘’]/g, "'")
    .replace(/[^\x00-\x7F]/g, ''));
  const msg = encodeURIComponent(safeLines.join('\n')).replace(/%5Cn/gi, '%0A');
  const url=`https://wa.me/${WHATSAPP_NUMBER}?text=${msg}`;

  if(WHATSAPP_NUMBER.includes('X')){
    alert('Demo ready! Replace WHATSAPP_NUMBER in the HTML with the hotel WhatsApp number.');
    return
  }
  window.open(url,'_blank');
  orderId=makeOrderId();
}
document.getElementById('search').addEventListener('input',render);
render();renderCart();
</script>
